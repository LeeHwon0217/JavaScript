<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테마변경</title>
  </head>
  <body>
    <button onclick="toggleTheme()">테마 변경</button>
    <p>현재 테마: <span id="themeText"></span></p>

    <script>
      function applyTheme(theme) {
        body.style.backgroundColor = theme === "dark" ? "#222" : "#fff"; // 배경색 변경
        body.style.color = theme === "dark" ? "#fff" : "#000"; // 글자색 변경
        document.getElementById("themeText").innerText = theme;
      }

      const body = document.body;

      function toggleTheme() {
        const current = localStorage.getItem("theme") || "light"; // 현재 테마 가져오기
        const next = current === "light" ? "dark" : "light"; // 다음 테마 결정
        localStorage.setItem("theme", next); // 다음 테마 저장
        applyTheme(next); // 테마 적용
      }

      applyTheme(localStorage.getItem("theme") || "light"); // 페이지 로드 시 테마 적용
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>node</title>
  </head>
  <body>
    <div id="box"></div>

    <ul id="list">
      <li id="item1">첫 번째 항목</li>
      <li id="item2">두 번째 항목</li>
    </ul>

    <div id="wrapper">
      <p id="old">기존 문단</p>
    </div>

    <script>
      const div = document.getElementById("box");
      // <p></p> 태그를 생성
      const p = document.createElement("p");
      // <p>새 문단 추가!</p> 태그를 생성
      p.innerText = "새 문단 추가!";
      // <div id="box"><p>새 문단 추가!</p></div> 형태로 추가
      div.appendChild(p); // div 요소에 p 요소 추가

      const ul = document.getElementById("list");
      const li = document.getElementById("item1");
      ul.removeChild(li); // ul 요소에서 li 요소 삭제

      const wrapper = document.getElementById("wrapper");
      const oldNode = document.getElementById("old");
      // <p></p>
      const newNode = document.createElement("p");
      // <p>새로운 문단입니다</p>
      newNode.innerText = "새로운 문단입니다";
      wrapper.replaceChild(newNode, oldNode); // 새로 적용하는게 앞

      // <li></li> 태그를 생성
      const newItem = document.createElement("li");
      // <li>사과</li> 태그를 생성
      newItem.innerText = "사과";
      const existingItem = ul.firstElementChild; // 첫 번째 항목을 가져옴
      ul.insertBefore(newItem, existingItem); // 첫 번째 항목 앞에 삽입

      const original = document.getElementById("wrapper");
      const clone = original.cloneNode(true); // true: 자식 요소까지 복사(깊은복사). false: 현재 노드만 복사
      document.body.appendChild(clone); // body에 복사된 노드 추가
    </script>
  </body>
</html>

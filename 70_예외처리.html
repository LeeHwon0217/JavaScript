<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예외처리</title>
  </head>
  <body>
    <!--
        문법 오류(syntax error): 코드 자체에 문법적 문제가 있는 경우
        런타임 오류(runtime error): 코드 실행 중 예기치않은 상황이 발생한 경우

        try {
            // 오류가 발생할 수 있는 코드
            // ...
        } catch (error) {
            // 오류가 발생했을 때 실행할 코드
        } finally {
            // 오류 발생 여부와 관계없이 항상 실행되는 코드
        }
    -->

    <script>
      /*
      function divide(a, b) {
        try {
          if (a === 0 || b === 0) {
            throw new Error("0으로 나눌 수 없습니다.");
          }
          console.log(a / b);
        } catch (err) {
          console.log("오류 발생: ", err.message);
        }
      }

      divide(10, 2); // 정상 실행
      divide(10, 0);
      console.log("프로그램을 종료합니다");
     */

      function getAgeInput(input) {
        try {
          if (!input) {
            throw new Error("입력값이 없습니다.");
          }
          const age = Number(input);
          if (isNaN(age)) {
            throw new Error("숫자를 입력해야 합니다.");
          }
          if (age < 0) {
            throw new Error("나이는 0보다 작을 수 없습니다.");
          }
          console.log("입력한 나이: ", age);
        } catch (err) {
          console.log("오류: ", err.message);
        } finally {
          console.log("나이 출력 결과가 끝났습니다");
        }
      }

      getAgeInput(20); // 정상 실행
      getAgeInput(); // 오류 발생
      getAgeInput("스무살"); // NaN 발생. 에러발생이 아니므로 일부러 에러를 넣는다 쓰로우
      getAgeInput(-5); // 오류 발생
      console.log("프로그램을 종료합니다.");
      //프로그램이 뻗으면 아래 코드가 실행이 안됨됨
    </script>
  </body>
</html>

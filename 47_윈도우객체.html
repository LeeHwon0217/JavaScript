<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>윈도우 객체</title>
  </head>
  <body>
    <script>
      // setTimeout() : 일정 시간 후에 콜백함수를 실행
      const hello = function () {
        alert("안녕하세요 자바스크립트");
      }; // alert: 대화상자 띄우기

      const st = setTimeout(hello, 4000); //  // 4초 후에 hello 함수 실행
      clearTimeout(st); // setTimeout을 취소하는 방법

      // setInterval() : 특정 시간동안 반복하여 콜백함수를 실행
      const si = setInterval(hello, 3000);

      const clearInter = function () {
        clearInterval(si); // setInterval을 취소하는 방법
        alert("hello 함수가 중지됨");
      };
    </script>
    <button onclick="clearInter()">중지</button>
  </body>
</html>
